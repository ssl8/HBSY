name: CI and Security Verification

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  domain-and-demo-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore and Build .NET Solution
        run: dotnet build NOVA.HBYS.sln --configuration Release
      - name: Run .NET Domain Unit Tests
        run: dotnet test tests/DomainTests/DomainTests.csproj --configuration Release --no-build
      - name: Verify Node & ES Module JS Syntax and CSP Compliance
        run: |
          node --check server.js
          node --check web/app.js
          for f in web/js/*.js web/js/components/*.js web/js/views/*.js tests/test-server.js tests/test-tour.js; do
            node --check "$f"
          done
          if grep -rnE "on(click|change|input|submit|keydown|keyup)=" web/; then
            echo "Inline event handlers violate script-src 'self'" && exit 1
          fi
      - name: Run Node Parity API & 12-Step Simulation Tests
        run: |
          npm run test:api
          npm run test:tour

  stack-security-and-e2e:
    runs-on: ubuntu-latest
    needs: domain-and-demo-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Prepare Environment
        run: |
          cp .env.example .env
          echo "HBYS_SEED_DEMO_DATA=true" >> .env
      - name: Build and Start Stack
        run: docker compose up -d --build
      - name: Wait for Gateway, Keycloak, ConnectorSvc and IntegrationWorker Readiness
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8088/api/config >/dev/null \
              && curl -fsS http://127.0.0.1:8080/realms/hbys/.well-known/openid-configuration >/dev/null \
              && curl -fsS http://127.0.0.1:8088/health/connector >/dev/null \
              && curl -fsS http://127.0.0.1:8088/health/worker >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Run DB Security & V001-V016 Least-Privilege Verification
        run: bash scripts/check-db-security.sh
      - name: API Unauthenticated Rejection & Runtime Config Smoke Check
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/api/patients)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/api/orders)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/api/audit)" = "401"
          curl -fsS http://127.0.0.1:8088/api/config | grep -q '"auth":"oidc"'
      - name: Run Browser E2E RBAC and Stage 4 Workflow Tests
        run: npm run e2e
      - name: Print Service Logs on Failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear Down Stack
        if: always()
        run: docker compose down -v
