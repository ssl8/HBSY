    environment:
      <<: *api-common-env
      HBYS_CONNECTOR_MODE: ${HBYS_CONNECTOR_MODE:-sandbox}
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=hbys;Username=connector_svc;Password=${CONNECTOR_DB_PASSWORD:-${INTEGRATION_DB_PASSWORD:?Missing INTEGRATION_DB_PASSWORD}};Pooling=true;Minimum Pool Size=0;Maximum Pool Size=8;Timeout=15;Command Timeout=30;Application Name=connector-svc
