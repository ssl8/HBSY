name: nova-hbys-stage3

x-api-common-env: &api-common-env
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: http://+:8080
  HBYS_WEB_ORIGIN: ${HBYS_WEB_ORIGIN:-http://localhost:8088}
  Keycloak__MetadataAddress: http://keycloak:8080/realms/hbys/.well-known/openid-configuration
  Keycloak__ValidIssuer: ${HBYS_PUBLIC_ISSUER:?Run start-windows.bat to generate .env}
  Keycloak__Audience: hbys-api

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: hbys
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run start-windows.bat to generate .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      HBYS_MIGRATOR_PASSWORD: ${HBYS_MIGRATOR_PASSWORD:?Missing HBYS_MIGRATOR_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Missing KEYCLOAK_DB_PASSWORD}
      PATIENT_DB_PASSWORD: ${PATIENT_DB_PASSWORD:?Missing PATIENT_DB_PASSWORD}
      CLINICAL_DB_PASSWORD: ${CLINICAL_DB_PASSWORD:?Missing CLINICAL_DB_PASSWORD}
      ADT_DB_PASSWORD: ${ADT_DB_PASSWORD:?Missing ADT_DB_PASSWORD}
      PHARMACY_DB_PASSWORD: ${PHARMACY_DB_PASSWORD:?Missing PHARMACY_DB_PASSWORD}
      BILLING_DB_PASSWORD: ${BILLING_DB_PASSWORD:?Missing BILLING_DB_PASSWORD}
      PUBLICHEALTH_DB_PASSWORD: ${PUBLICHEALTH_DB_PASSWORD:?Missing PUBLICHEALTH_DB_PASSWORD}
      LIS_DB_PASSWORD: ${LIS_DB_PASSWORD:?Missing LIS_DB_PASSWORD}
      INTEGRATION_DB_PASSWORD: ${INTEGRATION_DB_PASSWORD:?Missing INTEGRATION_DB_PASSWORD}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:?Missing AUDIT_DB_PASSWORD}
      CONNECTOR_DB_PASSWORD: ${CONNECTOR_DB_PASSWORD:-${INTEGRATION_DB_PASSWORD:?Missing INTEGRATION_DB_PASSWORD}}
      INTEGRATION_WORKER_DB_PASSWORD: ${INTEGRATION_WORKER_DB_PASSWORD:-${INTEGRATION_DB_PASSWORD:?Missing INTEGRATION_DB_PASSWORD}}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/10-create-roles.sh:/docker-entrypoint-initdb.d/10-create-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hbys"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  db-migrate:
    image: postgres:18.6-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${HBYS_MIGRATOR_PASSWORD:?Missing HBYS_MIGRATOR_PASSWORD}
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: hbys
      PGUSER: hbys_migrator
    volumes:
      - ./db/migrations:/migrations:ro
      - ./infra/postgres/migrate.sh:/scripts/migrate.sh:ro
    entrypoint: ["/bin/sh", "/scripts/migrate.sh"]
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/hbys
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: keycloak_app
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Missing KEYCLOAK_DB_PASSWORD}
      KC_DB_POOL_INITIAL_SIZE: "2"
      KC_DB_POOL_MIN_SIZE: "2"
      KC_DB_POOL_MAX_SIZE: "12"
      KC_DB_CONNECT_TIMEOUT: 10s
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Missing KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_STRICT: "true"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG: console
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./infra/keycloak/hbys-realm.json:/opt/keycloak/data/import/hbys-realm.json:ro
    restart: unless-stopped

  patient-svc:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        PROJECT: src/PatientSvc/PatientSvc.csproj
        ENTRY_DLL: PatientSvc.dll
    environment:
      <<: *api-common-env
      HBYS_MODE: enterprise
      HBYS_AUTH: oidc
      OIDC_ISSUER: ${HBYS_PUBLIC_ISSUER:?Run start-windows.bat to generate .env}
      OIDC_CLIENT_ID: hbys-web
      HBYS_ENABLE_SIMULATION: "true"
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=hbys;Username=patient_svc;Password=${PATIENT_DB_PASSWORD:?Missing PATIENT_DB_PASSWORD};Pooling=true;Minimum Pool Size=0;Maximum Pool Size=8;Timeout=15;Command Timeout=30;Application Name=patient-svc
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  clinical-svc:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        PROJECT: src/ClinicalSvc/ClinicalSvc.csproj
        ENTRY_DLL: ClinicalSvc.dll
    environment:
      <<: *api-common-env
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=hbys;Username=clinical_svc;Password=${CLINICAL_DB_PASSWORD:?Missing CLINICAL_DB_PASSWORD};Pooling=true;Minimum Pool Size=0;Maximum Pool Size=8;Timeout=15;Command Timeout=30;Application Name=clinical-svc
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  adt-svc:
