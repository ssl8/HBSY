    environment:
      <<: *api-common-env
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=hbys;Username=pharmacy_svc;Password=${PHARMACY_DB_PASSWORD:?Missing PHARMACY_DB_PASSWORD};Pooling=true;Minimum Pool Size=0;Maximum Pool Size=8;Timeout=15;Command Timeout=30;Application Name=pharmacy-svc
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  billing-svc:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        PROJECT: src/BillingSvc/BillingSvc.csproj
        ENTRY_DLL: BillingSvc.dll
    environment:
      <<: *api-common-env
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=hbys;Username=billing_svc;Password=${BILLING_DB_PASSWORD:?Missing BILLING_DB_PASSWORD};Pooling=true;Minimum Pool Size=0;Maximum Pool Size=8;Timeout=15;Command Timeout=30;Application Name=billing-svc
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  publichealth-svc:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        PROJECT: src/PublicHealthSvc/PublicHealthSvc.csproj
        ENTRY_DLL: PublicHealthSvc.dll
