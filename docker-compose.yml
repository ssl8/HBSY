    environment:
      <<: *api-common-env
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=hbys;Username=adt_svc;Password=${ADT_DB_PASSWORD:?Missing ADT_DB_PASSWORD};Pooling=true;Minimum Pool Size=0;Maximum Pool Size=8;Timeout=15;Command Timeout=30;Application Name=adt-svc
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    security_opt:
