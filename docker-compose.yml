      <<: *api-common-env
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=hbys;Username=integration_svc;Password=${INTEGRATION_DB_PASSWORD:?Missing INTEGRATION_DB_PASSWORD};Pooling=true;Minimum Pool Size=0;Maximum Pool Size=8;Timeout=15;Command Timeout=30;Application Name=integration-svc
    depends_on:
