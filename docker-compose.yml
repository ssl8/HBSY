      <<: *api-common-env
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=hbys;Username=publichealth_svc;Password=${PUBLICHEALTH_DB_PASSWORD:?Missing PUBLICHEALTH_DB_PASSWORD};Pooling=true;Minimum Pool Size=0;Maximum Pool Size=8;Timeout=15;Command Timeout=30;Application Name=publichealth-svc
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  lis-svc:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        PROJECT: src/LisSvc/LisSvc.csproj
        ENTRY_DLL: LisSvc.dll
    environment:
      <<: *api-common-env
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=hbys;Username=lis_svc;Password=${LIS_DB_PASSWORD:?Missing LIS_DB_PASSWORD};Pooling=true;Minimum Pool Size=0;Maximum Pool Size=8;Timeout=15;Command Timeout=30;Application Name=lis-svc
    depends_on:
