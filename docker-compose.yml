      ConnectionStrings__Default: Host=postgres;Port=5432;Database=hbys;Username=audit_svc;Password=${AUDIT_DB_PASSWORD:?Missing AUDIT_DB_PASSWORD};Pooling=true;Minimum Pool Size=0;Maximum Pool Size=8;Timeout=15;Command Timeout=30;Application Name=audit-svc
    depends_on:
