    cap_drop:
      - ALL
    restart: unless-stopped

  pharmacy-svc:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        PROJECT: src/PharmacySvc/PharmacySvc.csproj
