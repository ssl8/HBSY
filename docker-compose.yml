      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        PROJECT: src/IntegrationWorker/IntegrationWorker.csproj
        ENTRY_DLL: IntegrationWorker.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      HBYS_OUTBOX_MODE: ${HBYS_OUTBOX_MODE:-sandbox}
      HBYS_OUTBOX_POLL_SECONDS: ${HBYS_OUTBOX_POLL_SECONDS:-5}
      HBYS_OUTBOX_MAX_RETRIES: ${HBYS_OUTBOX_MAX_RETRIES:-5}
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=hbys;Username=integration_worker;Password=${INTEGRATION_WORKER_DB_PASSWORD:-${INTEGRATION_DB_PASSWORD:?Missing INTEGRATION_DB_PASSWORD}};Pooling=true;Minimum Pool Size=0;Maximum Pool Size=4;Timeout=15;Command Timeout=30;Application Name=integration-worker
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  web-gateway:
    image: nginx:stable-alpine
    depends_on:
      - patient-svc
      - clinical-svc
      - adt-svc
      - pharmacy-svc
      - billing-svc
      - publichealth-svc
      - lis-svc
      - integration-svc
      - audit-svc
      - connector-svc
      - integration-worker
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/proxy_params:/etc/nginx/conf.d/proxy_params:ro
      - ./web:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  pgdata:
