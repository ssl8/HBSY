worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 2m;
  gzip on;
  gzip_types text/css application/javascript application/json;

  map $http_x_correlation_id $hbys_correlation_id {
    default $http_x_correlation_id;
    '' $request_id;
  }

  server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:8080; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self' http://localhost:8080" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-store" always;

    location = /health {
      default_type application/json;
      return 200 '{"status":"ok","service":"web-gateway"}';
    }
    location = /health/patient { proxy_pass http://patient-svc:8080/health/ready; include /etc/nginx/conf.d/proxy_params; }
    location = /health/clinical { proxy_pass http://clinical-svc:8080/health/ready; include /etc/nginx/conf.d/proxy_params; }
    location = /health/adt { proxy_pass http://adt-svc:8080/health/ready; include /etc/nginx/conf.d/proxy_params; }
    location = /health/pharmacy { proxy_pass http://pharmacy-svc:8080/health/ready; include /etc/nginx/conf.d/proxy_params; }
    location = /health/billing { proxy_pass http://billing-svc:8080/health/ready; include /etc/nginx/conf.d/proxy_params; }
    location = /health/publichealth { proxy_pass http://publichealth-svc:8080/health/ready; include /etc/nginx/conf.d/proxy_params; }
    location = /health/lis { proxy_pass http://lis-svc:8080/health/ready; include /etc/nginx/conf.d/proxy_params; }
    location = /health/integration { proxy_pass http://integration-svc:8080/health/ready; include /etc/nginx/conf.d/proxy_params; }
    location = /health/audit { proxy_pass http://audit-svc:8080/health/ready; include /etc/nginx/conf.d/proxy_params; }
    location = /health/connector { proxy_pass http://connector-svc:8080/health/ready; include /etc/nginx/conf.d/proxy_params; }
    location = /health/worker { proxy_pass http://integration-worker:8080/health/ready; include /etc/nginx/conf.d/proxy_params; }
    location = /api/config { proxy_pass http://patient-svc:8080; include /etc/nginx/conf.d/proxy_params; }
    location = /api/me { proxy_pass http://patient-svc:8080; include /etc/nginx/conf.d/proxy_params; }
    location = /api/dashboard { proxy_pass http://patient-svc:8080; include /etc/nginx/conf.d/proxy_params; }
    location = /api/search { proxy_pass http://patient-svc:8080; include /etc/nginx/conf.d/proxy_params; }
    location ~ ^/api/encounters/[0-9]+/charge-preview$ { proxy_pass http://billing-svc:8080; include /etc/nginx/conf.d/proxy_params; }
    location /api/patients { proxy_pass http://patient-svc:8080; include /etc/nginx/conf.d/proxy_params; }
    location /api/encounters { proxy_pass http://patient-svc:8080; include /etc/nginx/conf.d/proxy_params; }
    location /api/orders { proxy_pass http://clinical-svc:8080; include /etc/nginx/conf.d/proxy_params; }
    location /api/lab-results { proxy_pass http://clinical-svc:8080; include /etc/nginx/conf.d/proxy_params; }
    location /api/radiology-reports { proxy_pass http://clinical-svc:8080; include /etc/nginx/conf.d/proxy_params; }
    location /api/beds { proxy_pass http://adt-svc:8080; include /etc/nginx/conf.d/proxy_params; }
    location /api/admissions { proxy_pass http://adt-svc:8080; include /etc/nginx/conf.d/proxy_params; }
    location /api/drugs { proxy_pass http://pharmacy-svc:8080; include /etc/nginx/conf.d/proxy_params; }
    location /api/prescriptions { proxy_pass http://pharmacy-svc:8080; include /etc/nginx/conf.d/proxy_params; }
    location /api/invoices { proxy_pass http://billing-svc:8080; include /etc/nginx/conf.d/proxy_params; }
    location /api/vaccinations { proxy_pass http://publichealth-svc:8080; include /etc/nginx/conf.d/proxy_params; }
    location /api/hl7/ { proxy_pass http://lis-svc:8080; include /etc/nginx/conf.d/proxy_params; }
    location /api/lis/ { proxy_pass http://lis-svc:8080; include /etc/nginx/conf.d/proxy_params; }
    location /api/integrations { proxy_pass http://integration-svc:8080; include /etc/nginx/conf.d/proxy_params; }
    location /api/connectors { proxy_pass http://connector-svc:8080; include /etc/nginx/conf.d/proxy_params; }
    location /api/audit { proxy_pass http://audit-svc:8080; include /etc/nginx/conf.d/proxy_params; }
    location /api/ { default_type application/json; return 404 '{"error":"API endpoint not found"}'; }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
